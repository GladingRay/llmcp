name: Model CI

# This workflow must run on an Apple Silicon runner with enough disk for the
# model and arenas. Do not enable pull_request for a public repository unless
# the self-hosted runner is isolated from secrets and trusted code only.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: model-ci
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  LLVM_PREFIX: /opt/homebrew/opt/llvm@20
  LLMCP_MODEL_DIR: ${{ vars.LLMCP_MODEL_DIR }}
  BUILD_DIR: build-model

jobs:
  model-test:
    # A self-hosted runner must provide the model at LLMCP_MODEL_DIR.
    # Suggested labels: self-hosted, macOS, ARM64, llmcp-model.
    runs-on: [self-hosted, macOS, ARM64, llmcp-model]
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check architecture
        run: test "$(uname -m)" = "arm64"

      - name: Resolve model directory
        shell: bash
        run: |
          model_dir="${LLMCP_MODEL_DIR:-$HOME/models/qwen3.5-4b}"
          test -f "$model_dir/config.json"
          test -f "$model_dir/tokenizer.json"
          echo "LLMCP_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          cargo --version
          rustc --version
          python3 --version
          df -h .

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch numpy lit

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DMLIR_DIR="$LLVM_PREFIX/lib/cmake/mlir" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DLLMCP_BUILD_TESTS=ON \
            -DLLMCP_CARGO_OFFLINE=OFF \
            -DLLMCP_MODEL_DIR="$LLMCP_MODEL_DIR"

      - name: Build
        run: cmake --build "$BUILD_DIR" -j 4

      - name: Real-model compile and lowering tests
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure -j1 \
            -R 'llmcp-(dump-real|lower-real|pack-real|pack-real-q8|tokenizer|chat-template|compile-real|compile-real-q8)'

      - name: Build arenas and AOT libraries for golden tests
        shell: bash
        run: |
          bin="$BUILD_DIR/bin"
          "$bin/llmcp-pack" --model "$LLMCP_MODEL_DIR" \
            --out "$BUILD_DIR/weights.bin" \
            --manifest "$BUILD_DIR/weights.json"
          "$bin/llmcp-pack" --model "$LLMCP_MODEL_DIR" --quant q8_0 \
            --out "$BUILD_DIR/weights-q8.bin" \
            --manifest "$BUILD_DIR/weights-q8.json"
          "$bin/llmcp-compile" --model "$LLMCP_MODEL_DIR" --emit=shared \
            --out "$BUILD_DIR/libqwen35_aot.dylib"
          "$bin/llmcp-compile" --model "$LLMCP_MODEL_DIR" --quant q8_0 \
            --emit=shared --out "$BUILD_DIR/libqwen35_aot_q8.dylib"
          df -h .

      - name: Reconfigure to register golden tests
        shell: bash
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DMLIR_DIR="$LLVM_PREFIX/lib/cmake/mlir" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DLLMCP_BUILD_TESTS=ON \
            -DLLMCP_CARGO_OFFLINE=OFF \
            -DLLMCP_MODEL_DIR="$LLMCP_MODEL_DIR" \
            -DLLMCP_GOLDEN_BF16_WEIGHTS="$BUILD_DIR/weights.bin" \
            -DLLMCP_GOLDEN_BF16_MANIFEST="$BUILD_DIR/weights.json" \
            -DLLMCP_GOLDEN_BF16_AOT="$BUILD_DIR/libqwen35_aot.dylib" \
            -DLLMCP_GOLDEN_Q8_WEIGHTS="$BUILD_DIR/weights-q8.bin" \
            -DLLMCP_GOLDEN_Q8_MANIFEST="$BUILD_DIR/weights-q8.json" \
            -DLLMCP_GOLDEN_Q8_AOT="$BUILD_DIR/libqwen35_aot_q8.dylib"

      - name: Golden token tests
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure -j1 \
            -R 'llmcp-golden-tokens-(bf16|q8)'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-ci-logs
          path: |
            build-model/Testing
            build-model/*.mlir
          if-no-files-found: ignore
